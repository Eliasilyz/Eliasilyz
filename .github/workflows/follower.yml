name: GitHub Follower Bot Running

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  up-and-running:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Follower bot
        env:
          github_user: ${{ github.repository_owner }}
          personal_github_token: ${{ secrets.PAT_TOKEN || secrets.METRICS_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python follower_bot.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add followers.txt follower_counter.txt
          timestamp=$(date -u)
          git commit -m "Update followers: ${timestamp} (UTC)" || exit 0
          git push origin main

