name: Update README

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours
  workflow_dispatch: {}      # manual "Run workflow" button

permissions:
  contents: write

jobs:
  update-dynamic-sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update quote / activity / blog sections
        env:
          GITHUB_USERNAME: Eliasilyz
          BLOG_RSS_URL: ${{ vars.BLOG_RSS_URL }}   # optional repo variable, leave unset to skip
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}    # raises the API rate limit from 60/hr to 5000/hr
        run: node scripts/update-readme.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: auto-update README dynamic sections"
          git push
