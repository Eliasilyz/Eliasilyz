name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, metadata
          
          # Achievements & Featured Repos
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/Eliasilyz
          
          # Coding Habits
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: elyasfarel
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 2

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stocks.svg
          base: ""
          plugin_stocks: yes
          plugin_stocks_token: ${{ secrets.STOCK_TOKEN }}
          plugin_stocks_stocks: BTC-USD, ETH-USD # Crypto / US Market Only