name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, metadata
          
          # Achievements & Featured Repos (Secrets di-off biar ga error)
          plugin_achievements: yes
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/Eliasilyz
          
          # Coding Habits (Menggunakan data standar tanpa query berat yang bikin error)
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: no  # Matikan chart ini karena ini sumber Unexpected Error di SVG utama!

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: elyasfarel
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites
          plugin_anilist_limit: 2