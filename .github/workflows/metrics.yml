name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, metadata, repositories
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/EliasDex-2, Eliasilyz/EliasDex, Eliasilyz/RellBotv2

          # 🧑‍🤝‍🧑 People Section (Followers & Following)
          plugin_people: yes
          plugin_people_limit: 28
          plugin_people_size: 28
          plugin_people_types: followers, following
          
          # 🎼 Music Activity (Recently Listened & Random Tracks from Playlist)
          plugin_music: yes
          plugin_music_provider: youtube
          plugin_music_mode: playlist
          plugin_music_playlist: https://music.youtube.com/playlist?list=PLYERoMfjs6Tc
          plugin_music_limit: 4

          plugin_leetcode: yes
          plugin_leetcode_user: eliasilyz
          plugin_leetcode_sections: solved, skills, recent

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 365
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.anilist.svg
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: elyasfarel
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites,characters
          plugin_anilist_limit: 5