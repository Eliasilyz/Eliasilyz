name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, metadata, repositories
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/finance-analytics-api, Eliasilyz/VaLuLens

          plugin_leetcode: yes
          plugin_leetcode_user: eliasilyz
          plugin_leetcode_sections: solved

          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes

          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://farelhanafi.my.id

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 120
          plugin_wakatime_sections: time, projects, languages, editors, os
