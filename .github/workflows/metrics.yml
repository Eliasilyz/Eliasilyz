name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          base: header, activity, community, metadata, repositories
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/EliasDex-2, Eliasilyz/RellBotv2

          plugin_people: yes
          plugin_people_limit: 30
          plugin_people_size: 30
          plugin_people_types: followers

          plugin_leetcode: yes
          plugin_leetcode_user: eliasilyz
          plugin_leetcode_sections: solved, skills

          plugin_notable: yes
          plugin_notable_indepth: yes
          plugin_notable_repositories: yes

          plugin_pagespeed: yes
          plugin_pagespeed_token: ${{ secrets.PAGESPEED_TOKEN }}
          plugin_pagespeed_url: https://farelhanafi.my.id

          plugin_wakatime: yes
          plugin_wakatime_token: ${{ secrets.WAKATIME_API_KEY }}
          plugin_wakatime_days: 365