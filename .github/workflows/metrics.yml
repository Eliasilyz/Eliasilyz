name: Metrics
on:
  schedule:
    - cron: "0 0 * * *" # Jalankan otomatis tiap hari
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 1. Base Metrics + Coding Habits + Achievements + People + Featured Repositories
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          
          # Features
          plugin_achievements: yes
          plugin_achievements_secrets: yes
          plugin_achievements_threshold: C
          
          plugin_repositories: yes
          plugin_repositories_featured: Eliasilyz/Eliasilyz
          
          plugin_people: yes
          plugin_people_types: followers, following
          plugin_people_limit: 28
          
          plugin_habits: yes
          plugin_habits_from: 200
          plugin_habits_days: 14
          plugin_habits_facts: yes
          plugin_habits_charts: yes

      # 2. Anilist Metrics (Anime & Manga Watch/Read List)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.anilist.svg
          plugin_anilist: yes
          plugin_anilist_user: elyasfarel # Ganti dengan username AniList kamu jika ada
          plugin_anilist_medias: anime, manga
          plugin_anilist_sections: favorites, characters
          plugin_anilist_limit: 2

      # 3. Stock Market Metrics (IHSG / Indonesian Stock Exchange)
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.stocks.svg
          plugin_stocks: yes
          plugin_stocks_token: ${{ secrets.STOCK_TOKEN }} # Opsional: jika pakai API key Yahoo Finance/Alpha Vantage
          plugin_stocks_stocks: ^JKSE # Ticker Symbol untuk IHSG (Jakarta Composite)
