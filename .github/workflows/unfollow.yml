name: GitHub Unfollow Bot (Daily Auto & Manual)

on:
  schedule:
    - cron: '0 0 * * *'  # Berjalan otomatis setiap hari (00:00 UTC)
  workflow_dispatch:
    inputs:
      days:
        description: 'Days threshold to unfollow (default: 7)'
        required: true
        default: '7'
        type: string
      dry_run:
        description: 'Dry run (simulate only, do not unfollow)'
        required: true
        default: false
        type: boolean
      immediate:
        description: 'Immediate unfollow all non-followers (ignore days threshold)'
        required: true
        default: false
        type: boolean

jobs:
  unfollow-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Unfollow bot
        env:
          github_user: ${{ github.repository_owner }}
          personal_github_token: ${{ secrets.PAT_TOKEN || secrets.METRICS_TOKEN || secrets.PERSONAL_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          UNFOLLOW_WHITELIST: ${{ secrets.UNFOLLOW_WHITELIST }}
        run: |
          DAYS="${{ inputs.days }}"
          if [ -z "$DAYS" ]; then
            DAYS="7"
          fi
          FLAGS="--force --days $DAYS"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          if [ "${{ inputs.immediate }}" = "true" ]; then
            FLAGS="$FLAGS --immediate"
          fi
          python scripts/unfollow_bot.py $FLAGS

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          timestamp=$(date -u)
          git commit -m "Update tracking & assets after unfollow: ${timestamp} (UTC)" || exit 0
          git push origin main
